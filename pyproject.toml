[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-windows-tools"
version = "2.4.0"
description = "A professional terminal-based Windows utility platform and ecosystem command architecture"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Robin Güneş" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "mcp>=1.9,<2",
    "mss>=10,<11",
    "imageio-ffmpeg>=0.6,<1",
    "pyautogui>=0.9.54,<1",
    "pyperclip>=1.9,<2",
    "websockets>=14,<16",
    "Pillow>=10,<12",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.scripts]
nova = "nova_windows_tools:main"
NWT = "nova_windows_tools:main"
EWT = "easy_windows_tools:main"

[tool.setuptools]
py-modules = ["nova_windows_tools", "easy_windows_tools", "local_websocket", "websocket_standalone", "studio"]
packages = ["nova", "nova.core", "nova.discovery", "nova.settings", "nova.updates", "nova.cli"]
